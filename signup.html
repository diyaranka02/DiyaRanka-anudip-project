<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">

    <a class="navbar-brand fw-bold" href="#home">
      <i class="fa-solid fa-couch text-warning"></i> BUILT BETTER
    </a>

    <ul class="navbar-nav mx-auto d-flex flex-row">
      <li class="nav-item"><a class="nav-link active" href="index.html">HOME</a></li>
      <li class="nav-item"><a class="nav-link" href="services.html">SERVICES</a></li>
      <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
      <li class="nav-item"><a class="nav-link" href="shop.html">SHOP</a></li>
      <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
    </ul>

    <div class="d-flex align-items-center">
      <span class="me-4 text-warning fw-bold">CALL US : +91 98765 43210</span>
      <i class="fa-solid fa-magnifying-glass me-4"></i>
      <a href="login.html" class="text-dark text-decoration-none">LOGIN</a>
    </div>

  </div>
</nav>
<div class="container mt-5">
    <h2 class="text-center">Signup</h2>
    <div class="shadow p-4 bg-light rounded">
        <form id="signupForm">
            <div class="mb-3">
                <label class="form-label">Full Name:</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Signup</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.querySelector('input[name="name"]').value;
    let email = document.querySelector('input[name="email"]').value;
    let password = document.querySelector('input[name="password"]').value;

    // Save data in LocalStorage
    let user = {
        name: name,
        email: email,
        password: password
    };

    localStorage.setItem("user", JSON.stringify(user));

    alert("Signup Successful!");

    // Redirect to Login Page
    window.location.href = "login.html";
});
</script>

</body>
</html>
